  # Resilient aggregator feeds — act as a safety net so real hard-news
  # coverage doesn't vanish entirely if an individual outlet's RSS breaks
  # (as AP's, Anadolu's, and Haaretz's had). Google News RSS search is a
  # long-standing, reliable technique for this (see fivefilters.org and
  # others after Reuters/AP killed their own public feeds in 2020).
